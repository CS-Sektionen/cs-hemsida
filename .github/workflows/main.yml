name: Deploy

# Runs on every push to main and publishes the site.
# Pull requests are handled by ci.yml.
on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

# One deploy at a time, so two releases can't overwrite each other mid-upload.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    name: Push files
    steps:
      - name: Get latest code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@4.3.2
        with:
          server: ftpcluster.loopia.se
          username: cssektionen
          password: ${{ secrets.LOOPIA_FTP_PASSWORD }}
          port: 21
          local-dir: ./dist/
          log-level: verbose
