<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logos/cs-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css?family=Poppins" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=League%20Spartan" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Tilt%20Warp" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Bad Script" rel="stylesheet" />
    <title>CS-sektionen</title>
    <script>
      // Restores the real path after 404.html redirected here, before
      // React Router reads the URL. See public/404.html for the other half.
      (function () {
        var p = new URLSearchParams(window.location.search).get('p');
        if (p) {
          window.history.replaceState(null, '', '/' + decodeURIComponent(p));
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
